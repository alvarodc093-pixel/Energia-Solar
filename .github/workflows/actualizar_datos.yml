name: Actualizar datos y modelo

on:
  schedule:
    - cron: '0 6 * * 1'  # lunes a las 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pandas numpy scikit-learn joblib requests pytest
      - name: Descargar REE y Open-Meteo
        run: python descargar_datos.py
      - name: Limpiar y reentrenar
        run: |
          python datos.py
          python entrenar_modelo.py
          pytest -q
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/solar_espana.csv data/solar_espana_clean.csv models/modelo_solar.pkl
          git diff --cached --quiet || git commit -m "data: actualizacion semanal $(date +'%Y-%m-%d')"
          git push
